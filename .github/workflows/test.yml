name: Tests and standalone build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: src/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: npm ci
      - run: npm test
      - run: python -m pip install ete3==3.1.3 numpy scipy six
      - run: npm run test:reroot-validator
      - run: npm run build
      - name: Verify committed distribution matches source
        run: git diff --exit-code -- ../docs
